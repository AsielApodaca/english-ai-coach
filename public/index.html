<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English AI Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Full-height sidebar: brand · new session · history · footer (speech + user) -->
    <aside id="sidebar" class="sidebar" aria-label="Navigation and session history">
      <div class="sidebar-brand">
        <div class="side-brand">
          <span class="material-symbols-outlined brand-icon" aria-hidden="true">graphic_eq</span>
          <span class="brand-name">English AI Coach</span>
        </div>
        <button id="btn-sidebar-close" class="icon-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
          <span class="material-symbols-outlined" aria-hidden="true">left_panel_close</span>
        </button>
      </div>

      <button id="btn-new-session" class="btn new-session" title="New session (⌘K)">
        <span class="material-symbols-outlined" aria-hidden="true">add</span>
        <span class="new-session-label">New Session</span>
        <kbd>⌘K</kbd>
      </button>

      <div id="history-slots" class="history-slots"></div>

      <div class="sidebar-footer">
        <div id="speech-pill" class="status-pill" title="Speech engine status">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-label">Speech Engine</span>
          <span id="speech-pill-state" class="status-state">…</span>
        </div>
        <div class="sidebar-user">
          <div class="user-avatar" aria-hidden="true">
            <span class="material-symbols-outlined">person</span>
          </div>
          <div class="user-meta">
            <div class="user-name">Guest</div>
            <div class="user-role">local profile</div>
          </div>
          <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
            <span class="material-symbols-outlined" aria-hidden="true">settings</span>
          </button>
        </div>
      </div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Content column: top bar (right of the sidebar) + central stage -->
    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-sidebar-toggle" class="icon-btn" title="Show history sidebar" aria-label="Show history sidebar">
            <span class="material-symbols-outlined" aria-hidden="true">dock_to_right</span>
          </button>
          <div class="breadcrumb">
            <span class="material-symbols-outlined crumb-icon" aria-hidden="true">terminal</span>
            <span class="crumb">Studio</span>
            <span class="crumb-sep" aria-hidden="true">/</span>
            <span id="crumb-current" class="crumb-current">Config</span>
          </div>
        </div>
      </header>

      <main id="stage" class="stage">
        <div class="stage-inner">
          <!-- Config slot (feature 103) -->
          <section id="view-config" class="stage-view" data-view="config">
            <div class="stage-placeholder">
              <span class="material-symbols-outlined placeholder-icon" aria-hidden="true">tune</span>
              <h2 class="placeholder-title">Config</h2>
              <p class="placeholder-text">Session configuration slot — feature 103 arrives here.</p>
            </div>
          </section>
          <!-- Practice slot (feature 105) -->
          <section id="view-practice" class="stage-view" data-view="practice" hidden>
            <div class="stage-placeholder">
              <span class="material-symbols-outlined placeholder-icon" aria-hidden="true">record_voice_over</span>
              <h2 class="placeholder-title">Practice</h2>
              <p class="placeholder-text">Karaoke practice slot — feature 105 arrives here.</p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Settings overlay (feature 108): left nav + content pane -->
    <div id="settings-overlay" class="overlay" hidden>
      <div class="overlay-panel settings-overlay-panel" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="overlay-head">
          <h2 class="overlay-title">Settings</h2>
          <button id="btn-settings-close" class="icon-btn" title="Close" aria-label="Close settings">
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
          </button>
        </div>
        <div class="settings-layout">
          <nav id="settings-nav" class="settings-nav" aria-label="Settings sections"></nav>
          <div class="settings-main">
            <div id="settings-content" class="settings-content"></div>
            <div id="settings-status" class="settings-status" role="status"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
